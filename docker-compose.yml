# =============================================================================
# NEXUS FULFILLMENT SERVICE - DOCKER COMPOSE
# =============================================================================
# Khởi chạy độc lập Fulfillment Service:
#   CSDL chính lưu trên PostgreSQL cục bộ (port 5438 hoặc nexus-fulfillment-db)
#   docker compose up -d
# =============================================================================

services:

  # 1. Ứng dụng Fulfillment Service RESTful Web API (Port 8006)
  fulfillment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-fulfillment-service
    ports:
      - "${FULFILLMENT_SERVICE_PORT:-8006}:8006"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${FULFILLMENT_CONNECTION_STRING:-${CONNECTION_STRING:-Host=fulfillment-db;Port=5432;Database=fulfillment_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}}
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Port=${RABBITMQ_PORT:-5672}
      - RabbitMq__User=${RABBITMQ_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-guest}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    restart: unless-stopped

networks:
  default:
    name: nexus-network
