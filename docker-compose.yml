# =============================================================================
# NEXUS FULFILLMENT SERVICE - DOCKER COMPOSE
# =============================================================================
# Chạy độc lập service này. Database dùng Neon Cloud, hạ tầng dùng chung nexus-network.
# Lệnh: docker compose up -d --build
# =============================================================================

name: nexus-fulfillment

services:
  fulfillment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-fulfillment-service
    ports:
      - "${FULFILLMENT_SERVICE_PORT:-8006}:8006"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "${FULFILLMENT_DB_CONNECTION:?FULFILLMENT_DB_CONNECTION is required}"
      InternalSecurity__ServiceKey: "${INTERNAL_SERVICE_SECRET:-eaT0Ombups70WJzd85CBBpp8rAno55SxKn1qvYBGH9e}"
      Carriers__DefaultCarrierCode: "GHN"
      Carriers__GHN__Environment: "${GHN_ENVIRONMENT:-Staging}"
      Carriers__GHN__BaseUrl: "${GHN_BASE_URL:-https://dev-online-gateway.ghn.vn}"
      Carriers__GHN__Token: "${GHN_TOKEN:-}"
      Carriers__GHN__ShopId: "${GHN_SHOP_ID:-}"
      Carriers__GHN__WebhookSecret: "${GHN_WEBHOOK_SECRET:-ghn-webhook-secret-key}"
      COMMERCE_SERVICE_URL: "${COMMERCE_SERVICE_URL:-http://commerce-service:8003}"
      NOTIFICATION_SERVICE_URL: "${NOTIFICATION_SERVICE_URL:-http://notification-service:8007}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemma-4-31b-it}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}"
    restart: unless-stopped

networks:
  default:
    name: nexus-network
    external: true
