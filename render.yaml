services:
  - type: web
    name: nexus-fulfillment-service
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Development
      - key: PORT
        value: 8006
      - key: ASPNETCORE_URLS
        value: http://+:8006
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: InternalSecurity__ServiceKey
        sync: false
      - key: COMMERCE_SERVICE_URL
        value: http://nexus-commerce-service:8003
      - key: NOTIFICATION_SERVICE_URL
        value: http://nexus-notification-service:8007
      - key: Carriers__DefaultCarrierCode
        value: GHN
      - key: GHN_ENVIRONMENT
        value: Staging
      - key: GHN_BASE_URL
        value: https://dev-online-gateway.ghn.vn
      - key: GHN_TOKEN
        sync: false
      - key: GHN_SHOP_ID
        sync: false
      - key: GHN_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemma-4-31b-it
