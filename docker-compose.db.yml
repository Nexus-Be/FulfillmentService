name: nexus-db-fulfillment

services:
  postgres-fulfillment:
    image: postgres:16-alpine
    container_name: nexus-postgres-fulfillment
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: fulfillment_db
    ports:
      - "${FULFILLMENT_DB_PORT:-5438}:5432"
    volumes:
      - postgres_fulfillment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d fulfillment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_fulfillment_data:
    name: nexus-local_postgres_fulfillment_data

networks:
  default:
    name: nexus-network
    external: true
